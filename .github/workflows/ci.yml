name: Loop checks
on:
  push:
    branches: [main, "fix/**", "design/**"]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - name: Auto-fix formatting on validation branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/loop-mvp-validation'
        run: |
          bunx eslint . --fix || true
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u
            git commit -m 'style: apply ESLint and Prettier automatic fixes'
            git push origin HEAD:fix/loop-mvp-validation
          fi
      - run: bun run lint
      - run: bun run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
